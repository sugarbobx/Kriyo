# Kriyo — host nginx site (no Docker).
#
# Routes:
#   /api/, /admin/, /static/  -> Django (gunicorn on 127.0.0.1:8000)
#   everything else           -> React build published in /var/www/kriyo
#
# Install:
#   sudo cp deploy/nginx/kriyo.conf /etc/nginx/sites-available/kriyo
#   sudo ln -sfn /etc/nginx/sites-available/kriyo /etc/nginx/sites-enabled/kriyo
#   sudo nginx -t && sudo systemctl reload nginx
#
# The SPA is served from /var/www/kriyo rather than frontend/dist because
# nginx (www-data) cannot traverse /home/ubuntu (mode 750).
#
# HTTPS: once a domain points to the VPS, run certbot (`certbot --nginx -d <domain>`)
# and flip the SECURE_* settings in backend/.env (see deploy/README.md).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Replace with the real domain once there is one.
    server_name 3.217.155.20 _;
    client_max_body_size 10m;

    # --- Django ---------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django uses this (SECURE_PROXY_SSL_HEADER) to know the original scheme.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin / DRF static files, collected by `collectstatic` and served by whitenoise.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # --- React SPA -------------------------------------------------------
    # Baseline CSP for the SPA only (not /api/ or /admin/ -- Django admin's
    # own templates aren't audited against this policy, and the API returns
    # JSON anyway). 'unsafe-inline' on style-src is required because React
    # components set the `style` attribute directly throughout this app.
    # add_header does not inherit into a location that sets its own
    # add_header, so it's repeated on every SPA location below rather than
    # set once at the server level.
    set $kriyo_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

    # Vite emits content-hashed filenames, so assets can be cached forever.
    location /assets/ {
        root /var/www/kriyo;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $kriyo_csp;
    }

    # PWA manifest: nginx's mime.types has no entry for .webmanifest, so it would
    # be sent as application/octet-stream, which some browsers reject.
    location = /manifest.webmanifest {
        root /var/www/kriyo;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $kriyo_csp;
    }

    # Unknown paths fall back to index.html so client-side routes work on refresh.
    # index.html itself is never cached, so a new deploy is picked up immediately.
    location / {
        root /var/www/kriyo;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $kriyo_csp;
    }
}
