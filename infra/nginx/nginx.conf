# --- TLS (disabled until a real domain + certificate exist) ---
# Once certbot (or an external LB) has issued a certificate for the real
# domain, mount it into the nginx container (e.g. a volume at
# /etc/letsencrypt) and:
#   1. uncomment the two server blocks below
#   2. delete (or neuter) the plain `server { listen 80; ... }` block further
#      down, since its job is then only to redirect to HTTPS
#   3. set SECURE_SSL_REDIRECT / SESSION_COOKIE_SECURE / CSRF_COOKIE_SECURE /
#      SECURE_HSTS_SECONDS in backend/.env (see backend/.env.example)
#
# server {
#     listen 80;
#     server_name kriyo.example.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     server_name kriyo.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/kriyo.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/kriyo.example.com/privkey.pem;
#
#     client_max_body_size 10m;
#
#     location /api/ {
#         proxy_pass http://backend:8000/api/;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
#
#     location /admin/ {
#         proxy_pass http://backend:8000/admin/;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
#
#     location /static/ {
#         proxy_pass http://backend:8000/static/;
#     }
#
#     location / {
#         root /usr/share/nginx/html;
#         try_files $uri $uri/ /index.html;
#     }
# }

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
