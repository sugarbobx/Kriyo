services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped
